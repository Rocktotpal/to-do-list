<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <h1><i class="fa-solid fa-circle-check"></i> My Tasks</h1>
        <h3 id="date">Monday, July 26</h3>
      </header>
      <section class="create">
        <input type="text" placeholder="Task 1" class="task-field" />

        <button class="add"><i class="fa-solid fa-plus"></i></button>
      </section>
      <section class="filters">
        <button class="filter active-filter">All</button>
        <button class="filter">Active</button>
        <button class="filter">Completed</button>
      </section>
      <section class="todos-container">
        <ul class="todos-list">
          <!-- li will be inserted later -->
          <li class="todo">
            <input type="checkbox" class="checkbox" />
            <div class="task"><p>Build Projects</p></div>
            <button class="delete"><i class="fa-solid fa-x"></i></button>
          </li>
        </ul>
        <div class="empty-state hidden">
          <i class="fa-solid fa-clipboard-list"></i>
          <p>No tasks here yet</p>
        </div>
        <!-- <button class="delete hidden"><i class="fa-solid fa-x"></i></button> -->
      </section>

      <footer>
        <p id="items-left">0 itmes left</p>
        <button id="clear-completed">Clear completed</button>
        <!-- <div class="clear-completed">
          <p><i class="fa-solid fa-trash"></i></p>
        </div> -->
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
